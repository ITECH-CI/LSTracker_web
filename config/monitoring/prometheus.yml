# Prometheus — LSTracker (cahier IX.2). Cibles jointes par les réseaux Docker
# des stacks démo et prod ; l'application expose ses métriques sur son port
# de gestion interne 9300 (jamais publié).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: lstracker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["lst_demo_app:9300"]
        labels: { env: demo }
      - targets: ["lst_prod_app:9300"]
        labels: { env: prod }

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter_demo:9187"]
        labels: { env: demo }
      - targets: ["postgres_exporter_prod:9187"]
        labels: { env: prod }

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
        labels: { env: host }
