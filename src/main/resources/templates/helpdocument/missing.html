<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{fragments/header :: head}">
<title>Aide</title>
</head>

<body class="sb-nav-fixed">
	<div class="d-flex" id="wrapper">
		<div id="page-content-wrapper">

			<div th:insert="~{fragments/header :: header(content='Aide', module='help')}"></div>

			<div class="container-fluid py-5">
				<div class="text-center" style="max-width: 520px; margin: 0 auto;">
					<i class="fas fa-book-open fa-3x mb-3" style="color: #c7d2fe;"></i>
					<h2 class="h5" th:text="${documentLabel} + ' non encore disponible'">Manuel non encore disponible</h2>
					<p class="text-muted">
						Ce document n'a pas encore été publié. Il apparaîtra ici dès que l'administration l'aura mis en ligne.
					</p>
					<a th:href="@{/}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left"></i> Retour au tableau de bord</a>
				</div>
			</div>
		</div>
	</div>

	<footer class="py-4 bg-light mt-auto" th:insert="~{fragments/footer :: footer}"></footer>

	<script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
	<script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/webjars/font-awesome/5.15.4/js/all.js}"></script>
</body>
</html>
