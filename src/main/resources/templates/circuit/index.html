<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{fragments/header :: head}">
<title>Gestion des circuits</title>
</head>

<body class="sb-nav-fixed">

<style>
.admin-layout {
	display: grid;
	grid-template-columns: 300px 1fr;
	gap: 1rem;
	align-items: start;
}
@media (max-width: 992px) {
	.admin-layout { grid-template-columns: 1fr; }
	.admin-sidebar { position: static !important; max-height: none !important; }
}

.admin-sidebar {
	position: sticky;
	top: 70px;
	max-height: calc(100vh - 90px);
	overflow-y: auto;
	border: 1px solid #e6e9f3;
	border-radius: 6px;
	background: #fff;
}
.admin-sidebar .sidebar-header {
	background: #f8fafc;
	border-bottom: 1px solid #e6e9f3;
	padding: .75rem 1rem;
	border-radius: 6px 6px 0 0;
	display: flex;
	align-items: center;
	justify-content: space-between;
}
.admin-sidebar .sidebar-body { padding: 1rem; }
.admin-sidebar .filter-group { margin-bottom: 1rem; }
.admin-sidebar .filter-group > label.form-label {
	font-size: .72rem;
	text-transform: uppercase;
	font-weight: 600;
	color: #6b7280;
	letter-spacing: .03em;
	margin-bottom: .35rem;
}

.toggle-row {
	display: flex; align-items: center; justify-content: space-between;
	padding: .3rem 0;
}
.toggle-row span { font-size: .85rem; color: #374151; }

.admin-toolbar {
	display: flex; gap: .5rem; flex-wrap: wrap; align-items: stretch;
	margin-bottom: .5rem; padding: .5rem .75rem;
	border: 1px solid #e6e9f3; border-radius: 6px; background: #fff;
}
.admin-toolbar > .toolbar-item { display: flex; align-items: center; }
.search-input { max-width: 320px; flex: 1 1 220px; }
.search-input .form-control-sm { height: calc(1.5em + .5rem + 2px); }

.input-icon { position: relative; }
.input-icon i { position: absolute; left: .55rem; top: 50%; transform: translateY(-50%); color: #9ca3af; }
.input-icon input { padding-left: 1.75rem; }

.code-pill {
	display: inline-block;
	font-family: monospace;
	font-size: .72rem;
	font-weight: 600;
	padding: .15rem .5rem;
	border-radius: 4px;
	background: #f1f5f9;
	color: #1e293b;
}

.badge-status {
	display: inline-block;
	font-size: .7rem;
	font-weight: 600;
	padding: .15rem .55rem;
	border-radius: 1rem;
	white-space: nowrap;
}
.b-active { background: #e9f7ef; color: #167b3a; }
.b-inactive { background: #f3f4f6; color: #6b7280; }

.count-pill {
	display: inline-block;
	font-size: .72rem;
	font-weight: 600;
	padding: .15rem .55rem;
	border-radius: 1rem;
	background: #eef2ff;
	color: #3730a3;
}

.row-actions { display: flex; gap: .15rem; }
.row-actions .btn-action {
	border: 1px solid #d1d5db;
	background: #fff;
	color: #374151;
	font-size: .8rem;
	padding: .15rem .45rem;
	border-radius: 4px;
	cursor: pointer;
	line-height: 1;
	text-decoration: none;
}
.row-actions .btn-action:hover { background: #f3f4f6; }
.row-actions .btn-action.btn-warning-soft { color: #b45309; }
.row-actions .btn-action.btn-danger-soft { color: #dc2626; }

table#tab_circuits thead th {
	background: #f8fafc;
	border-bottom: 2px solid #e6e9f3;
	font-size: .8rem;
	white-space: nowrap;
}
table#tab_circuits tbody td {
	vertical-align: middle;
	font-size: .85rem;
}
table#tab_circuits tbody tr:hover { background: #fafcff; }

.empty-cell { color: #9ca3af; font-style: italic; }
</style>

	<div class="d-flex" id="wrapper">
		<div id="page-content-wrapper">

			<div th:insert="~{fragments/header :: header(content='Gestion des circuits', module='circuit')}"></div>

			<div class="container-fluid py-3">

				<div th:if="${message_error != null}" class="alert alert-danger" th:text="${message_error}"></div>
				<div th:if="${message_success != null}" class="alert alert-success" th:text="${message_success}"></div>

				<div class="admin-layout">

					<aside class="admin-sidebar">
						<div class="sidebar-header">
							<div class="d-flex align-items-center gap-2">
								<i class="fas fa-filter text-primary"></i>
								<strong>Filtres</strong>
							</div>
							<button class="btn btn-sm btn-link p-0 text-decoration-none" id="btnResetAll" type="button">
								<i class="fas fa-times-circle"></i> Effacer
							</button>
						</div>

						<div class="sidebar-body">
							<div class="filter-group">
								<label class="form-label" for="searchText">Recherche</label>
								<div class="input-icon">
									<i class="fas fa-search"></i>
									<input type="search" id="searchText" class="form-control form-control-sm"
										placeholder="numéro de circuit..." autocomplete="off"/>
								</div>
							</div>

							<div class="filter-group">
								<label class="form-label">Statut du circuit</label>
								<div class="toggle-row">
									<span><i class="fas fa-check-circle text-success me-1"></i>Actifs uniquement</span>
									<div class="form-check form-switch">
										<input class="form-check-input" type="checkbox" id="toggleActive"/>
									</div>
								</div>
								<div class="toggle-row">
									<span><i class="fas fa-times-circle text-secondary me-1"></i>Inactifs uniquement</span>
									<div class="form-check form-switch">
										<input class="form-check-input" type="checkbox" id="toggleInactive"/>
									</div>
								</div>
							</div>
						</div>
					</aside>

					<main>
						<div class="admin-toolbar">
							<div class="toolbar-item input-icon search-input">
								<i class="fas fa-search"></i>
								<input type="search" id="quickSearch" class="form-control form-control-sm"
									placeholder="Recherche rapide..." autocomplete="off"/>
							</div>

							<div class="toolbar-item ms-auto gap-2">
								<a class="btn btn-sm btn-primary me-2" th:href="@{/circuit/new}">
									<i class="fas fa-plus me-1"></i> Nouveau circuit
								</a>
								<button class="btn btn-sm btn-outline-secondary" id="btnReload" type="button" title="Rafraîchir">
									<i class="fas fa-sync"></i>
								</button>
							</div>
						</div>

						<div class="card shadow-sm">
							<div class="card-body p-2">
								<table id="tab_circuits" class="table table-sm table-hover table-striped align-middle" style="width:100%">
									<thead>
										<tr>
											<th style="width:50px;">#</th>
											<th>Numéro</th>
											<th>Nombre de sites</th>
											<th>Convoyeurs affectés</th>
											<th>Statut</th>
											<th>Créé le</th>
											<th>Actions</th>
										</tr>
									</thead>
								</table>
							</div>
						</div>
					</main>
				</div>
			</div>
		</div>
	</div>

	<footer class="py-4 bg-light mt-auto" th:insert="~{fragments/footer :: footer}"></footer>

	<script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
	<script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/webjars/font-awesome/5.15.4/js/all.js}"></script>
	<script th:src="@{/DataTables/datatables.min.js}"></script>

	<script th:inline="none">
	$(function () {
		// Toggles mutuellement exclusifs
		$('#toggleActive').on('change', function() {
			if (this.checked) $('#toggleInactive').prop('checked', false);
			reload();
		});
		$('#toggleInactive').on('change', function() {
			if (this.checked) $('#toggleActive').prop('checked', false);
			reload();
		});

		const table = $('#tab_circuits').DataTable({
			processing: true,
			serverSide: true,
			ordering: false,
			ajax: {
				url: 'circuit/data',
				data: function(d) {
					d.search_text = $('#searchText').val() || $('#quickSearch').val() || null;
					if ($('#toggleActive').is(':checked')) d.active = true;
					else if ($('#toggleInactive').is(':checked')) d.active = false;
					else d.active = null;
				},
				dataSrc: 'data',
				traditional: true
			},
			columns: [
				{
					data: null, orderable: false, searchable: false,
					className: 'text-center text-muted',
					render: function (data, type, row, meta) {
						return meta.row + meta.settings._iDisplayStart + 1;
					}
				},
				{ data: 'circuit_number', render: renderCode },
				{ data: 'site_count', render: renderSiteCount },
				{ data: 'conveyors', render: renderConveyors },
				{ data: 'is_active', render: renderStatus },
				{ data: 'created_at', render: renderDate },
				{ data: 'id', render: renderActions, orderable: false }
			],
			pageLength: 25,
			lengthMenu: [10, 25, 50, 100],
			dom: '<"row align-items-center mb-2"<"col-md-6"l><"col-md-6 text-end"i>>rtp',
			language: {
				processing: '<i class="fas fa-spinner fa-spin"></i> Chargement...',
				lengthMenu: 'Afficher _MENU_',
				info: '_START_–_END_ sur _TOTAL_',
				infoEmpty: 'Aucun circuit',
				zeroRecords: 'Aucun circuit trouvé',
				emptyTable: 'Aucun circuit',
				paginate: { first: '«', last: '»', next: '›', previous: '‹' }
			}
		});

		function reload() { table.ajax.reload(); }
		const debouncedReload = debounce(reload, 300);
		$('#searchText, #quickSearch').on('input', debouncedReload);
		$('#btnReload').on('click', reload);
		$('#btnResetAll').on('click', function() {
			$('#searchText, #quickSearch').val('');
			$('#toggleActive, #toggleInactive').prop('checked', false);
			reload();
		});
	});

	function renderCode(data) {
		return data ? '<span class="code-pill">' + escapeHtml(data) + '</span>' : '<span class="empty-cell">—</span>';
	}
	function renderSiteCount(data) {
		const n = (data == null) ? 0 : Number(data);
		if (n > 0) return '<span class="count-pill">' + n + '</span>';
		return '<span class="empty-cell">—</span>';
	}
	function renderConveyors(data) {
		if (data == null || String(data).trim() === '') {
			return '<span class="empty-cell">Aucun</span>';
		}
		return escapeHtml(data);
	}
	function renderStatus(data) {
		if (data === true || data === 'true' || data === 1) {
			return '<span class="badge-status b-active"><i class="fas fa-check-circle"></i> Actif</span>';
		}
		return '<span class="badge-status b-inactive"><i class="fas fa-times-circle"></i> Inactif</span>';
	}
	function renderDate(data) {
		if (!data) return '<span class="empty-cell">—</span>';
		const d = new Date(data);
		if (isNaN(d.getTime())) return escapeHtml(String(data));
		const dd = String(d.getDate()).padStart(2, '0');
		const mm = String(d.getMonth() + 1).padStart(2, '0');
		const yyyy = d.getFullYear();
		return dd + '/' + mm + '/' + yyyy;
	}
	function renderActions(data, type, row) {
		return meshActions('circuit', row, 'ce circuit');
	}

	function debounce(fn, ms) {
		let t;
		return function() {
			const args = arguments, ctx = this;
			clearTimeout(t);
			t = setTimeout(() => fn.apply(ctx, args), ms);
		};
	}
	function escapeHtml(str) {
		if (str == null) return '';
		return String(str).replace(/[&<>"']/g, function(c) {
			return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
		});
	}
	</script>

	<script th:src="@{/js/mesh-actions.js}"></script>
</body>
</html>
